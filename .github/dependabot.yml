version: 2

updates:
  # ─── npm (JS/TS core) ────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ─── pip (Python port) ───────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/ports/python"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ─── Composer (PHP port) ─────────────────────────────────────────────────
