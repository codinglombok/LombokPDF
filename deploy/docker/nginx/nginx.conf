# LombokPDF — Nginx Reverse Proxy Configuration
# Place at: deploy/docker/nginx/nginx.conf
# Mounted into the nginx container by docker-compose.yml

# Rate limiting zone: 10 requests/second per IP for PDF generation endpoints
limit_req_zone $binary_remote_addr zone=lombokpdf_gen:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ─── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header X-XSS-Protection          "1; mode=block"                     always;
    add_header Referrer-Policy           "no-referrer"                       always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

    # Hide nginx version
    server_tokens off;

    # ─── Request size limits ────────────────────────────────────────────────
    # Allow up to 20MB request bodies (for DOCX/CSV uploads)
    client_max_body_size 20m;
    client_body_timeout   30s;

    # ─── Health check (no rate limit, no logging) ──────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://lombokpdf-api:3000/health;
        proxy_read_timeout 5s;
    }

    # ─── PDF generation endpoints (rate limited) ───────────────────────────
    location / {
        limit_req zone=lombokpdf_gen burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://lombokpdf-api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # PDF generation can take a moment for large/complex documents
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # PDF responses can be large — increase buffer sizes
        proxy_buffer_size         128k;
        proxy_buffers              8 256k;
        proxy_busy_buffers_size   512k;

        # Disable caching for dynamically generated PDFs
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

