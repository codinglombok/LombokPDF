version: '3.9'

# LombokPDF — Production Docker Compose Stack
# Usage:
#   docker compose up -d
#   docker compose logs -f lombokpdf-api
#   docker compose down

services:

  # ─── LombokPDF API Service ─────────────────────────────────────────────────
  lombokpdf-api:
    image: lombokdigital/lombokpdf:latest
    # Or build locally:
    # build:
    #   context: ../..
    #   dockerfile: deploy/docker/Dockerfile
    container_name: lombokpdf-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CERT_PASS=${CERT_PASS:-}
      - LOMBOKPDF_TEMP_DIR=/tmp/lombokpdf
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Mount template overrides (optional)
      - ./templates:/app/templates:ro
      # Mount certs (optional — for signing)
      - ${CERT_DIR:-/dev/null}:/app/certs:ro
    tmpfs:
      - /tmp/lombokpdf:size=256m,mode=1777
    deploy:
      replicas: ${REPLICAS:-2}
      resources:
        limits:
          cpus: '1.0'
          memory: '256M'       # LombokPDF is lean — 256MB is plenty
        reservations:
          cpus: '0.25'
          memory: '64M'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "node", "-e", "require('./dist/index.js'); process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - lombokpdf-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lombokpdf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      lombokpdf-api:
        condition: service_healthy
    networks:
      - lombokpdf-net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  nginx-cache:

networks:
  lombokpdf-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
