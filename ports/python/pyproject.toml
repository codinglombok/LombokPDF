[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "lombokpdf"
version     = "1.0.0"
description = "Lightweight, elegant, polyglot PDF generation — Apache 2.0"
readme      = "README.md"
license     = { text = "Apache-2.0" }
authors     = [{ name = "Lombok Digital", email = "hello@codinglombok.dev" }]
keywords    = ["pdf", "pdf-generation", "html-to-pdf", "invoice", "report", "i18n", "rtl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
requires-python = ">=3.10"

dependencies = [
    "wasmtime>=20.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "Babel>=2.14.0",
    "python-bidi>=0.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "lombokpdf[test]",
]

[project.urls]
Homepage    = "https://lombokpdf.dev"
Repository  = "https://github.com/codinglombok/lombokpdf"
Issues      = "https://github.com/codinglombok/lombokpdf/issues"
Changelog   = "https://github.com/codinglombok/lombokpdf/blob/main/CHANGELOG.md"

[project.scripts]
lombokpdf = "lombokpdf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lombokpdf"]

[tool.mypy]
strict           = true
python_version   = "3.10"
ignore_missing_imports = false

[tool.ruff]
target-version = "py310"
line-length    = 100
select         = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20", "RUF"]
ignore         = ["S101"]  # allow assert in tests
